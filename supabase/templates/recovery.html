<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restablece tu contraseña de Spirit Coffee</title>
  </head>
  <body style="margin:0;background:#f8f1df;color:#2c2a26;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f8f1df;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#eecf62;border-radius:28px;">
            <tr>
              <td align="center" style="padding:40px 32px 16px;">
                <img src="https://www.spiritcoffee.es/email/logo-white.png" width="180" alt="Spirit Coffee" style="display:block;width:180px;max-width:100%;height:auto;border:0;">
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 40px;text-align:center;">
                <h1 style="margin:0 0 16px;font-family:Georgia,serif;font-size:34px;line-height:1.15;color:#2c2a26;">Crea una nueva contraseña</h1>
                <p style="margin:0 0 28px;font-size:16px;line-height:1.6;color:#4b4538;">Hemos recibido una solicitud para restablecer la contraseña de tu cuenta Spirit.</p>
                <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;padding:16px 28px;border-radius:999px;background:#171713;color:#ffffff;font-size:16px;font-weight:700;text-decoration:none;">Restablecer contraseña</a>
                <p style="margin:28px 0 0;font-size:13px;line-height:1.5;color:#625a48;">Este enlace es personal, caduca y solo puede utilizarse una vez. Si no has solicitado el cambio, ignora este mensaje.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
